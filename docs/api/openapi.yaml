openapi: 3.1.0
info:
  title: ISCP API
  version: 0.2.0
  summary: API-first ISCP protocol v2 reference services
servers:
  - url: http://localhost:8080
    description: Relay Reference Service
  - url: http://localhost:8081
    description: Trust Root Reference Service
paths:
  /.well-known/iscp/relay:
    get:
      summary: Fetch signed relay descriptor
      responses:
        "200":
          description: Signed relay descriptor and pin
  /v2/relay/devices/bind-self:
    post:
      summary: Bootstrap a first device using DeviceIdentity, DeviceProof, and an actor authorization
      responses:
        "200": { description: Access and refresh credentials }
        "401": { description: Invalid proof, or missing actor authorization in production }
  /v2/relay/devices/register-with-ticket:
    post:
      summary: Register an invited device using a signed pairing ticket
      responses:
        "200": { description: Access and refresh credentials }
        "400": { description: Missing signed ticket object in production }
        "401": { description: Invalid proof or proof challenge not bound to the ticket id }
        "403": { description: Ticket invalid, not bound to this relay, or consumed by its grant audience }
        "409": { description: Ticket already consumed }
  /v2/relay/devices/refresh-access:
    post:
      summary: Refresh relay access
      responses:
        "200": { description: New access and refresh credentials }
        "401": { description: Invalid refresh credential }
  /v2/relay/devices/revoke-access:
    post:
      summary: Revoke relay access for a device
      security:
        - RelayAccess: []
        - AdminToken: []
      responses:
        "200": { description: Revoked }
        "401": { description: Missing access or admin credential }
        "403": { description: Access credential cannot revoke another device }
  /v2/relay/connect:
    get:
      summary: Relay WebSocket connect challenge and READY state machine
      responses:
        "101": { description: WebSocket upgraded }
  /v2/relay/envelopes:
    post:
      summary: Submit an opaque SecureEnvelope
      security:
        - RelayAccess: []
          RelayAccessProof: []
      responses:
        "202": { description: Relay receipt }
        "401": { description: Missing or invalid relay access credential or production proof }
        "403": { description: Access credential does not match envelope sender }
  /v2/relay/admin/devices:
    get:
      summary: List relay device metadata
      security:
        - AdminToken: []
      responses:
        "200": { description: Devices }
        "401": { description: Missing admin credential }
  /v2/relay/admin/connections:
    get:
      summary: List relay connection metadata
      security:
        - AdminToken: []
      responses:
        "200": { description: Connections }
        "401": { description: Missing admin credential }
  /v2/relay/admin/messages:
    get:
      summary: List relay message metadata without payload plaintext
      security:
        - AdminToken: []
      responses:
        "200": { description: Message metadata }
        "401": { description: Missing admin credential }
  /api/sparkclaw/iscp-control/v1/service-recover:
    post:
      tags: [SparkClaw profile]
      summary: Recover credentials for an existing operator service identity
      description: >-
        Optional SparkClaw binding. Requires a signed device proof and a pinned
        receipt wrapping key. It cannot register a new identity. Available only
        when the Relay is configured with the managed authority adapter.
      responses:
        "200": { description: Credentials sealed to the supplied receipt wrapping key }
        "400": { description: Invalid recovery request }
        "403": { description: Identity unapproved, revoked or invalid device proof }
        "404": { description: Managed adapter disabled }
        "405": { description: Method not allowed }
        "409": { description: Recovery operation conflicts with existing state }
        "503": { description: Managed authority unavailable }
  /.well-known/iscp/trust-root:
    get:
      summary: Fetch signed Trust Root descriptor
      responses:
        "200": { description: Signed descriptor }
  /v2/trust/devices/submit:
    post:
      summary: Submit a device identity to Trust Root
      responses:
        "200": { description: Device record }
  /v2/trust/devices/authorize:
    post:
      summary: Authorize a device and issue a Trust Grant
      security:
        - AdminToken: []
      responses:
        "200": { description: Trust Grant }
        "401": { description: Missing admin credential }
  /v2/trust/devices/revoke:
    post:
      summary: Revoke a device and increase revocation epoch
      security:
        - AdminToken: []
      responses:
        "200": { description: Device revoked }
        "401": { description: Missing admin credential }
  /v2/trust/devices/status:
    get:
      summary: Fetch device authorization status
      parameters:
        - name: device_id
          in: query
          required: true
          schema: { type: string }
        - name: domain_id
          in: query
          required: false
          description: Optional for single-domain deployments; required by multi-tenant deployments. A mismatch is indistinguishable from not-found.
          schema: { type: string }
      responses:
        "200":
          description: Device status
          content:
            application/json:
              schema:
                $ref: "../../schemas/json/trust.device_status.v2.json"
        "404": { description: Device not found or domain scope mismatch }
        "429": { description: Rate limit exceeded }
  /v2/trust/grants/verify:
    post:
      summary: Verify Trust Grant permission, audience, confirmation, relay, and revocation
      responses:
        "200": { description: Grant valid }
        "403": { description: Grant invalid }
  /v2/trust/grants/status:
    get:
      summary: Fetch Grant status
      parameters:
        - name: grant_id
          in: query
          required: true
          schema: { type: string }
        - name: domain_id
          in: query
          required: false
          description: Optional; when supplied a mismatch is indistinguishable from not-found so cross-domain grant IDs cannot be probed.
          schema: { type: string }
      responses:
        "200":
          description: Grant status
          content:
            application/json:
              schema:
                $ref: "../../schemas/json/trust.grant_status.v2.json"
        "404": { description: Grant not found or domain scope mismatch }
        "429": { description: Rate limit exceeded }
  /v2/trust/grants/revoke:
    post:
      summary: Revoke a Trust Grant
      security:
        - AdminToken: []
      responses:
        "200": { description: Grant revoked }
        "401": { description: Missing admin credential }
        "404": { description: Grant not found }
  /v2/trust/revocations:
    get:
      summary: List device and grant revocations
      parameters:
        - name: domain_id
          in: query
          required: false
          description: Optional for single-domain deployments; required by multi-tenant deployments.
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200 }
        - name: cursor
          in: query
          required: false
          description: Opaque pagination cursor from a prior response's next_cursor.
          schema: { type: string }
      responses:
        "200":
          description: Revocations
          content:
            application/json:
              schema:
                $ref: "../../schemas/json/trust.revocations.v2.json"
        "400": { description: Invalid limit }
        "429": { description: Rate limit exceeded }
  /v2/trust/keys/rotate:
    post:
      summary: Rotate Trust Root signing key next to active
      security:
        - AdminToken: []
      responses:
        "200": { description: Active key }
        "401": { description: Missing admin credential }
  /v2/trust/admin/audit:
    get:
      summary: List Trust Root audit metadata
      security:
        - AdminToken: []
      responses:
        "200": { description: Audit entries }
        "401": { description: Missing admin credential }
components:
  securitySchemes:
    RelayAccess:
      type: http
      scheme: bearer
      description: Relay access credential issued by bind-self or refresh-access.
    RelayAccessProof:
      type: apiKey
      in: header
      name: X-ISCP-Access-Proof
      description: Base64url encoded DeviceProof required for production Relay envelope submission.
    AdminToken:
      type: apiKey
      in: header
      name: X-ISCP-Admin-Token
      description: Operator credential required by production profile for admin and authorization operations.
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [type, code, message, retryable]
      properties:
        type: { const: iscp.error.v2 }
        code: { type: string }
        message: { type: string }
        retryable: { type: boolean }
        request_id: { type: string }
        details:
          type: object
          additionalProperties: { type: string }
