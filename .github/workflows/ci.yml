name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: go test ./...
      - run: go vet ./...

  sparkclaw-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: iscp
          POSTGRES_PASSWORD: iscp-ci-test-only
          POSTGRES_DB: iscp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iscp -d iscp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: node scripts/sync-iscp-operations.mjs --check
      - run: go test -race ./pkg/server/relay ./pkg/iscp/appstream ./extensions/sparkclaw/... ./cmd/...
        env:
          GOWORK: "off"
          SC_RELAY_TEST_DSN: postgres://iscp:iscp-ci-test-only@127.0.0.1:5432/iscp?sslmode=disable
          SC_RELAY_LONG_TEST: "1"
      # These fixtures share a schema; run the two package binaries serially.
      - run: go test -p 1 -race -count=1 ./extensions/sparkclaw/iscpnodeclient ./extensions/sparkclaw/iscpnodeissuer
        env:
          GOWORK: "off"
          SC_ISCP_NODE_TEST_DSN: postgres://iscp:iscp-ci-test-only@127.0.0.1:5432/iscp?sslmode=disable

  release-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
      - run: ./scripts/release-gate.sh
